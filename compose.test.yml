name: rapidaid-test
services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27018:27017"]
    tmpfs: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
